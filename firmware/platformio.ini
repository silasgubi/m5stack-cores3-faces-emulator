; NES (Nofrendo) and Game Boy (gnuboy) for M5Stack CoreS3 + Faces Bottom3 + Faces Gamepad3.
; Emulator cores and the NES OSD layer come from Cardputer Game Station (geo-tp).
; Keep the build output out of cloud-synced folders: set PLATFORMIO_WORKSPACE_DIR.

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.11

monitor_speed = 115200
; Optional games to play without an SD card: put .nes/.gb/.gbc files in data/roms/ and the
; pre-script packs them into data/roms.bin (the file name is the menu name). It also makes
; data/logo.png optional. See scripts/embed_data.py.
extra_scripts = pre:scripts/embed_data.py
board_build.embed_files =
    data/roms.bin
    data/logo.png

build_unflags = -Os
build_flags =
    -O2
    -Wl,--wrap=bmp_create
    -Wl,--wrap=bmp_destroy
    -DCORE_DEBUG_LEVEL=1

; Same firmware with the on-screen text in Brazilian Portuguese (src/ui_text.h).
[env:cores3-ptbr]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DUI_LANG_PT_BR=1
