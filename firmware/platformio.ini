; NES (Nofrendo) and Game Boy (gnuboy) for M5Stack CoreS3 + Faces Bottom3 + Faces Gamepad3.
; Emulator cores and the NES OSD layer come from Cardputer Game Station (geo-tp).
; Keep the build output out of cloud-synced folders: set PLATFORMIO_WORKSPACE_DIR.

[platformio]
default_envs = cores3
; Optional local settings, not tracked by git (see [embed] below).
extra_configs = platformio_local.ini

; Menu names of the optional embedded ROMs data/game.nes and data/game.gb. Defaults are
; "Demo.nes" / "Demo.gb". The name also names the save file, so keep the extension.
; Override in platformio_local.ini, for example:
;   [embed]
;   names = '-DEMBED_NES_NAME="My Game.nes"' '-DEMBED_GB_NAME="My Game.gb"'
[embed]
names =

[env:cores3]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.11

monitor_speed = 115200
; All three files are optional: the pre-script creates 1-byte placeholders for missing
; ones (objcopy rejects empty files) and the firmware ignores them.
extra_scripts = pre:scripts/rom_placeholders.py
board_build.embed_files =
    data/game.nes
    data/game.gb
    data/logo.png

build_unflags = -Os
build_flags =
    -O2
    -Wl,--wrap=bmp_create
    -Wl,--wrap=bmp_destroy
    -DCORE_DEBUG_LEVEL=1
    ${embed.names}

; Same firmware with the on-screen text in Brazilian Portuguese (src/ui_text.h).
[env:cores3-ptbr]
extends = env:cores3
build_flags =
    ${env:cores3.build_flags}
    -DUI_LANG_PT_BR=1
